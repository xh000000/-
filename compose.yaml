services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  backend:
    build: ./backend
    env_file: .env
    environment:
      API_ONLY: "1"
      HOST: "0.0.0.0"
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      - research-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/bootstrap',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  research-data:
